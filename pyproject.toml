[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labdaq"
version = "1.0.0"
description = "Chinese DT9837C data acquisition workbench"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0", "scipy>=1.13", "PySide6>=6.8", "pyqtgraph>=0.14,<0.15",
    "pyusb>=1.3,<2", "libusb-package>=1.0.26",
]

[project.optional-dependencies]
test = ["pytest>=8"]
build = ["pyinstaller==6.22.3"]

[project.scripts]
labdaq = "labdaq.gui:main"

[tool.setuptools.packages.find]
include = ["labdaq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
