[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labdaq-prototype"
version = "0.1.0"
description = "Chinese desktop DAQ prototype with a source-grounded DT9837C protocol simulator"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0", "scipy>=1.13", "PySide6>=6.8", "pyqtgraph>=0.14,<0.15",
    "pyusb>=1.3,<2", "libusb-package>=1.0.26",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
labdaq = "labdaq.gui:main"

[tool.setuptools.packages.find]
include = ["labdaq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
