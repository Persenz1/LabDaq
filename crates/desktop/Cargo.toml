[package]
name = "labdaq-desktop"
version.workspace = true
edition.workspace = true

[lib]
name = "labdaq_desktop"

[[bin]]
name = "LabDAQ"
path = "src/main.rs"

[[bin]]
name = "labdaq-cli"
path = "src/cli.rs"

[dependencies]
labdaq-data = { path = "../data" }
labdaq-analysis = { path = "../analysis" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_plot = "=0.34.1"
rfd = "0.15"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png"] }
